services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: CVpolish
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d CVpolish"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/CVpolish
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__
            - .venv
            - "*.pyc"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    develop:
      watch:
        # Rebuild the image when dependencies change (new npm packages).
        - action: rebuild
          path: ./frontend/package.json
        # Sync source files; writes happen from inside the container,
        # so Next.js file watching / hot reload actually works.
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules
            - .next

volumes:
  pgdata:
